<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Web</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbw7TKibPU_3uFwO2g6QT1_wE4Q6UUuxcMtJRRoXzILDRoEav1nSdV87UXBJSEg1oeD4/exec" 
    allow="clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>
</body>
</html>
